<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leitura · Mentirômetro</title>
  <link rel="icon" type="image/png" href="/static/logo-ie.png">
  <link rel="stylesheet" href="/static/shell.css">
  <style>
    @font-face {
      font-family: "Archivo Black";
      src: url("/static/fonts/archivo-black.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Literata";
      src: url("/static/fonts/literata-500.ttf") format("truetype");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Literata";
      src: url("/static/fonts/literata-700.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }
    :root {
      --cotton: #f4f4f2;
      --ink: #111111;
      --tie: #ff5a1f;
      --plate: #ffffff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--cotton);
      color: var(--ink);
      font-family: Literata, Georgia, serif;
      font-weight: 500;
      font-size: 1.05rem;
      line-height: 1.55;
    }
    ::selection { background: var(--tie); color: var(--ink); }
    :focus-visible { outline: 3px solid var(--tie); outline-offset: 3px; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-thumb { background: var(--ink); }
    ::-webkit-scrollbar-track { background: var(--cotton); }
    .stripe {
      height: 72px;
      background: repeating-linear-gradient(45deg, #111 0 16px, #ff5a1f 16px 32px);
    }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 22px 40px 8px;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select, button, textarea {
      font-family: "Archivo Black", sans-serif;
      letter-spacing: 0.04em;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--plate);
      color: var(--ink);
      min-height: 48px;
    }
    select, button { padding: 0 14px; cursor: pointer; }
    button { background: var(--ink); color: var(--cotton); }
    button:hover { background: var(--tie); color: #fff; }
    main { padding: 8px 40px 64px; }
    .fala { max-width: 74ch; margin: 36px 0 0; }
    .fala + .fala { margin-top: 56px; }
    .q {
      font-family: "Archivo Black", sans-serif;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0 0 14px;
      max-width: 28ch;
    }
    .fala:first-child .q { font-size: clamp(1.8rem, 3.2vw, 2.7rem); max-width: 22ch; }
    .fala:not(:first-child) .q { font-size: clamp(1.6rem, 3vw, 2.2rem); }
    .q::before, .q::after { content: '"'; }
    .tie {
      display: inline-block;
      margin: 0 0 16px;
      padding: 6px 10px;
      background: var(--tie);
      color: var(--ink);
      font-family: "Archivo Black", sans-serif;
      letter-spacing: 0.06em;
      transform-origin: top center;
      animation: swing 0.7s cubic-bezier(0.16, 1, 0.3, 1) 1;
    }
    .tie::before { content: '"'; }
    .tie::after { content: '"'; }
    @keyframes swing {
      0% { transform: rotate(0deg); }
      35% { transform: rotate(-8deg); }
      100% { transform: rotate(0deg); }
    }
    .who, .stamp, .kind {
      font-family: "Archivo Black", sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .who { margin: 0 0 8px; }
    .stamp { margin: 18px 0 8px; font-size: 0.95rem; padding: 6px 10px; }
    .sum, .miss { margin: 0 0 12px; max-width: 70ch; }
    .miss { color: #3a3a3a; }
    ul { margin: 12px 0 0; padding: 0; list-style: none; }
    li { margin: 0 0 14px; max-width: 70ch; }
    a { color: var(--ink); text-underline-offset: 4px; }
    a:hover { background: var(--tie); }
    .fix { margin: 16px 0; max-width: 70ch; }
    .fix strong {
      display: inline-block;
      margin-right: 8px;
      padding: 2px 6px;
      background: var(--ink);
      color: var(--cotton);
      font-family: "Archivo Black", sans-serif;
      font-weight: 400;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    form.erro { display: grid; gap: 8px; max-width: 70ch; margin-top: 8px; }
    textarea {
      min-height: 96px;
      padding: 12px;
      font-family: Literata, Georgia, serif;
      font-weight: 500;
      letter-spacing: 0;
      font-size: 1rem;
      resize: vertical;
    }
    #error:not(:empty) {
      display: inline-block;
      margin: 12px 0 0;
      padding: 8px 12px;
      background: var(--tie);
      font-family: "Archivo Black", sans-serif;
    }
    .empty { font-family: "Archivo Black", sans-serif; font-size: clamp(2rem, 4vw, 3rem); max-width: 16ch; line-height: 0.98; }
    @media (max-width: 720px) {
      .stripe { height: 48px; }
      .bar, main { padding-left: 16px; padding-right: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .tie { animation: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/static/logo-ie.png" alt="" width="36" height="36"><strong>Mentirômetro</strong></a>
    <nav class="nav" aria-label="Seções">
      <a href="/">Ao vivo</a>
      <a class="here" href="/leitura">Leitura</a>
      <a href="/checar">Checar</a>
      <a href="/dashboard">Placar</a>
      <a href="/metodo">Método</a>
    </nav>
  </header>
  <div class="bar">
    <div class="filters">
      <select id="speaker" aria-label="Candidato">
        <option value="">Os dois</option>
        <option value="lula">Lula</option>
        <option value="flavio">Flávio</option>
      </select>
      <select id="status" aria-label="Carimbo">
        <option value="">Todos os carimbos</option>
      </select>
      <select id="theme" aria-label="Tema">
        <option value="">Todos os temas</option>
      </select>
    </div>
  </div>
  <main>
    <p id="error" role="status"></p>
    <div id="list"></div>
  </main>
  <script src="/static/card.js"></script>
  <script>
    const labels = {
      sustentado: "Sustentado", sustentado_ressalva: "Sustentado com ressalva",
      nao_e_bem_assim: "Não é bem assim", exagerado: "Exagerado", distorcido: "Distorcido",
      contradito: "Contradito", sem_prova: "Sem prova", sem_prova_publica: "Sem prova pública",
      versoes_em_disputa: "Versões em disputa", indicio: "Indício", dados_incompletos: "Dados incompletos",
      audio_confuso: "Áudio confuso", sem_evidencia: "Sem fonte suficiente", inconclusivo: "Em aberto",
      promessa: "Promessa"
    };
    const themes = {
      saude: "Saúde", economia: "Economia", seguranca: "Segurança", educacao: "Educação",
      meio_ambiente: "Meio ambiente", assistencia: "Assistência", infraestrutura: "Infraestrutura",
      politica: "Política", outro: "Outro"
    };
    const who = { lula: "Lula", flavio: "Flávio", avulsa: "Checagem" };
    const errorBox = document.querySelector("#error");

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function fill(select, entries, empty) {
      const current = select.value;
      select.innerHTML = `<option value="">${empty}</option>` + entries.map(([key, label]) =>
        `<option value="${escapeHtml(key)}">${escapeHtml(label)}</option>`
      ).join("");
      select.value = current;
    }

    function tone(status) {
      if (status === "sustentado" || status === "sustentado_ressalva") return "ok";
      if (status === "exagerado" || status === "nao_e_bem_assim" || status === "promessa") return "warn";
      if (status === "contradito" || status === "distorcido" || status === "sem_prova" || status === "erro") return "bad";
      return "open";
    }

    function card(claim, live) {
      const sources = (claim.sources || []).map((source) =>
        `<li><span class="kind">"${escapeHtml(source.kind || "fonte")}"</span> <a href="${escapeHtml(source.url)}" target="_blank" rel="noopener">${escapeHtml(source.title || "página")}</a><br>${escapeHtml(source.excerpt || source.note || "")}</li>`
      ).join("");
      const correction = claim.correction
        ? `<p class="fix"><strong>"CORREÇÃO"</strong> ${escapeHtml(claim.correction)}</p>`
        : "";
      const person = who[claim.speaker] || claim.speaker;
      const topic = themes[claim.theme] || "";
      const whoLine = topic ? `${person} · ${topic}` : person;
      const tie = live ? `<p class="tie">AO VIVO</p>` : "";
      const title = live ? "h1" : "h2";
      return `<article class="fala">
        ${tie}
        <${title} class="q">${escapeHtml(claim.normalized || claim.quote)}</${title}>
        <p class="who">${escapeHtml(whoLine)}</p>
        <p class="stamp ${tone(claim.status)}">${escapeHtml(labels[claim.status] || claim.status)}</p>
        <p class="sum">${escapeHtml(claim.summary || "")}</p>
        ${claim.missing ? `<p class="miss">${escapeHtml(claim.missing)}</p>` : ""}
        ${sources ? `<ul>${sources}</ul>` : ""}
        ${correction}
        <p class="actions">
          <button type="button" data-card="feed" data-id="${claim.id}">Imagem</button>
          <button type="button" data-card="stories" data-id="${claim.id}">Stories</button>
        </p>
        <form class="erro" data-erro="${claim.id}">
          <textarea name="note" minlength="8" maxlength="500" required placeholder="Achei um erro. Diga o que está errado."></textarea>
          <button type="submit">Enviar o aviso</button>
        </form>
      </article>`;
    }

    fill(document.querySelector("#status"), Object.entries(labels), "Todos os carimbos");
    fill(document.querySelector("#theme"), Object.entries(themes), "Todos os temas");

    let claims = [];

    async function load() {
      const params = new URLSearchParams();
      for (const id of ["speaker", "status", "theme"]) {
        const value = document.querySelector("#" + id).value;
        if (value) params.set(id, value);
      }
      const response = await fetch("/api/publico?" + params.toString());
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "A leitura não respondeu. Tente de novo.");
      claims = data.claims || [];
      document.querySelector("#list").innerHTML = claims.length
        ? claims.map((claim, index) => card(claim, index === 0)).join("")
        : `<p class="empty">"Nenhuma checagem com esse filtro."</p>`;
    }

    document.querySelector("#list").addEventListener("click", (event) => {
      const button = event.target.closest("[data-card]");
      if (!button) return;
      const claim = claims.find((item) => item.id === Number(button.dataset.id));
      if (claim) MentiroCard.png(claim, button.dataset.card);
    });

    document.querySelector("#list").addEventListener("submit", async (event) => {
      const form = event.target.closest("[data-erro]");
      if (!form) return;
      event.preventDefault();
      errorBox.textContent = "";
      try {
        const response = await fetch("/api/publico/erros", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ claim_id: Number(form.dataset.erro), note: form.note.value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || "O aviso não saiu. Escreva de novo e envie.");
        form.reset();
        errorBox.textContent = "Recebido. A correção entra na frase quando o painel publicar.";
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    for (const id of ["speaker", "status", "theme"]) {
      document.querySelector("#" + id).addEventListener("change", () => {
        load().catch((error) => { errorBox.textContent = error.message; });
      });
    }

    load().catch((error) => { errorBox.textContent = error.message; });
  </script>
</body>
</html>
