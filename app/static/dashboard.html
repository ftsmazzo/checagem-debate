<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0c">
  <title>Mentirômetro · IEleitoral</title>
  <link rel="icon" type="image/png" href="/static/logo-ie-icon.png">
  <link rel="stylesheet" href="/static/shell.css">
  <style>
    main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0 48px; }
    .lead { max-width: 62ch; }
    .login, .card, .phrase { background: var(--plate); border: 1px solid var(--ie-line); padding: 16px; }
    .login { display: flex; gap: 8px; max-width: 420px; }
    input, select, button { font: inherit; border: 1px solid var(--ie-line); background: var(--ie-bg-soft); color: var(--paper); caret-color: var(--coral); padding: 10px 12px; }
    button { background: var(--coral); color: var(--night); border-color: var(--coral); font-family: "Archivo Black", sans-serif; cursor: pointer; }
    button:hover { background: var(--ie-coral-deep); }
    .bar { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pct { font-family: "Archivo Black", sans-serif; font-size: 2.4rem; margin: 8px 0; }
    .meta { color: var(--ie-muted); font-size: 0.9rem; }
    .counts { display: flex; gap: 10px; flex-wrap: wrap; }
    .phrase { margin-top: 10px; }
    .phrase strong { display: block; margin: 8px 0; }
    a.back {
      display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px;
      border: 1px solid var(--ie-line); color: var(--paper); text-decoration: none;
      font-family: "Archivo Black", sans-serif; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
    }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/static/logo-ie-mark.png" alt="Inteligência Eleitoral"><strong>Mentirômetro</strong></a>
    <nav class="nav" aria-label="Seções">
      <a href="/">Ao vivo</a>
      <a href="/leitura">Leitura</a>
      <a href="/checar">Checar</a>
      <a class="here" href="/dashboard">Placar</a>
      <a href="/placar-2">Placar 2</a>
      <a href="/metodo">Método</a>
    </nav>
  </header>
  <main>
    <form id="login" class="login" hidden>
      <input id="password" type="password" placeholder="Senha do painel" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="app">
      <p class="lead">Cada debate fica guardado. Band — 18/10 não é apagado quando você abre o próximo.</p>
      <div class="bar">
        <select id="debate" aria-label="Debate"></select>
        <button id="create" type="button">Criar o próximo debate</button>
        <a class="back" href="/">Voltar ao vivo</a>
      </div>
      <p id="formula" class="meta"></p>
      <p id="error" class="error"></p>
      <div id="cards" class="grid"></div>
    </div>
  </main>
  <script>
    const login = document.querySelector("#login");
    const app = document.querySelector("#app");
    const errorBox = document.querySelector("#error");
    const labels = {
      sustentado: "verdadeiro", sustentado_ressalva: "verdadeiro, mas...", nao_e_bem_assim: "não é bem assim",
      contradito: "falso", exagerado: "exagerado", distorcido: "distorcido", sem_prova: "sem provas",
      sem_prova_publica: "sem prova pública", versoes_em_disputa: "em disputa", indicio: "indício",
      dados_incompletos: "dados incompletos", audio_confuso: "áudio confuso", promessa: "promessa",
      sem_evidencia: "sem evidência", inconclusivo: "em aberto"
    };

    async function api(path, options) {
      const response = await fetch(path, { credentials: "same-origin", ...options });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        app.hidden = true;
        login.hidden = false;
        throw new Error("faça login");
      }
      if (!response.ok) throw new Error(data.detail || "falha na consulta");
      return data;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    }

    function card(item) {
      const total = Object.values(item.counts).reduce((sum, value) => sum + value, 0);
      const note = total
        ? "Cada número é um carimbo. Promessa não entra como erro."
        : "Este candidato ainda não tem fala checada neste debate.";
      const counts = Object.entries(item.counts).filter(([, value]) => value).map(([key, value]) => `<span>${labels[key] || key} ${value}</span>`).join("");
      const phrases = (item.claims || []).map((row) => {
        const source = (row.sources || [])[0];
        const link = source ? `<a href="${escapeHtml(source.url)}" target="_blank" rel="noopener">${escapeHtml(source.title || "fonte")}</a>` : "";
        const excerpt = source ? `<p class="meta">${escapeHtml(source.kind || "")} ${escapeHtml(source.excerpt || source.note || "")}</p>` : "";
        return `<article class="phrase"><span class="chip ${row.status}">${labels[row.status] || row.status}</span><strong>${escapeHtml(row.normalized || row.quote)}</strong><p class="meta">${escapeHtml(row.summary || "")}</p>${excerpt}${link}</article>`;
      }).join("");
      return `<section class="card"><h2>${escapeHtml(item.nome)}</h2><p class="pct">${total}</p><p class="meta">${note}</p><div class="counts">${counts}</div>${phrases}</section>`;
    }

    async function load(slug) {
      const data = await api("/api/debates/" + encodeURIComponent(slug) + "/placar");
      document.querySelector("#formula").textContent = data.debate
        ? `${data.debate.title} · o placar conta carimbos. A leitura pública fica em Leitura.`
        : "";
      document.querySelector("#cards").innerHTML = (data.candidates || []).map(card).join("");
    }

    async function refreshList(prefer) {
      const data = await api("/api/debates");
      const select = document.querySelector("#debate");
      select.innerHTML = (data.debates || []).map((row) => `<option value="${escapeHtml(row.slug)}">${escapeHtml(row.title)}${row.active ? " · ativo" : ""}</option>`).join("");
      const chosen = prefer || (data.debates || []).find((row) => row.active)?.slug || (data.debates || [])[0]?.slug;
      if (chosen) {
        select.value = chosen;
        await load(chosen);
      }
    }

    login.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      try {
        await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.querySelector("#password").value })
        });
        login.hidden = true;
        app.hidden = false;
        await refreshList();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#debate").addEventListener("change", async (event) => {
      try { await load(event.target.value); } catch (error) { errorBox.textContent = error.message; }
    });

    document.querySelector("#create").addEventListener("click", async () => {
      const title = window.prompt("Nome do próximo debate. Band — 18/10 continua na lista.");
      if (!title || title.trim().length < 3) return;
      try {
        const created = await api("/api/debates", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title.trim() })
        });
        await refreshList(created.slug);
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    api("/api/debates").then(async () => {
      login.hidden = true;
      app.hidden = false;
      await refreshList();
    }).catch(() => {});
  </script>
</body>
</html>
