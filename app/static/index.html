<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f1ec">
  <title>Ao vivo · Mentirômetro</title>
  <link rel="icon" type="image/png" href="/static/logo-ie.png">
  <link rel="stylesheet" href="/static/shell.css">
  <style>
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .saved {
      margin: 16px 0 0;
      padding: 12px 14px;
      background: var(--plate);
      border: 2px solid var(--ink);
    }
    .saved strong { display: block; margin-bottom: 4px; }
    .lead { margin: 0 0 12px; color: var(--ie-ink-soft); max-width: 62ch; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    h1 { display: none; }
    .bar, .composer, .login, section {
      background: var(--plate);
      border: 2px solid var(--ink);
      border-radius: 0;
      box-shadow: none;
    }
    .bar, .login {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px;
    }
    .composer {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px;
      margin-top: 0;
    }
    input, textarea, select, button {
      font: inherit;
      border-radius: var(--ie-radius-sm);
      border: 1px solid var(--ie-line);
    }
    input, textarea, select {
      background: var(--ie-bg-soft);
      color: var(--ie-ink);
      padding: 10px 12px;
    }
    input, select { min-width: 0; }
    #fonte, #gravar { width: 220px; flex: 0 0 220px; }
    #url { flex: 1 1 280px; min-width: 220px; }
    textarea { min-height: 140px; width: 100%; resize: vertical; }
    button {
      background: var(--ink);
      color: var(--cotton);
      padding: 10px 14px;
      cursor: pointer;
      font-family: "Archivo Black", sans-serif;
      font-weight: 400;
      letter-spacing: 0.03em;
      border: 2px solid var(--ink);
    }
    button:hover { background: var(--tie); border-color: var(--tie); color: #fff; }
    button.ghost {
      background: transparent;
      color: var(--ie-ink-soft);
      border-color: var(--ie-line);
    }
    button.ghost:hover {
      background: var(--ie-accent-soft);
      color: var(--ie-ink);
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--ie-accent);
      outline-offset: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
      gap: 16px;
      margin: 16px 0 48px;
    }
    section { padding: 16px 18px; min-height: 280px; }
    h2 {
      margin: 0 0 12px;
      font-family: "Archivo Black", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .chunk p { margin: 0; line-height: 1.6; max-width: 68ch; }
    .chunk:first-of-type, .claim:first-of-type { border-top: 0; }
    .chunk.marked {
      background: var(--ie-accent-soft);
      margin: 0 -8px;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 12px;
    }
    .row { display: flex; gap: 10px; align-items: flex-start; }
    .row p { margin: 0; line-height: 1.45; color: var(--ie-ink-soft); }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .meta { color: var(--ie-muted); font-size: 0.82rem; font-weight: 500; }
    .chip {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #0f141c;
      letter-spacing: 0.02em;
    }
    .sustentado, .sustentado_ressalva { background: var(--ie-success); }
    .contradito, .distorcido, .sem_prova { background: var(--ie-danger); color: #fff; }
    .exagerado, .nao_e_bem_assim, .promessa { background: var(--ie-warn); }
    .sem_evidencia, .inconclusivo, .sem_prova_publica, .versoes_em_disputa, .indicio, .dados_incompletos, .audio_confuso, .erro { background: var(--ie-accent); color: #fff; }
    .pendente { background: var(--ie-muted); color: #0f141c; }
    .error { color: #ffb4b4; white-space: pre-wrap; margin: 10px 0; }
    a { color: var(--ie-accent); }
    #login { margin: 16px 0; }
    .claim strong { font-weight: 800; color: var(--ie-ink); }
    .claim ul { margin: 8px 0 0; padding-left: 18px; color: var(--ie-ink-soft); }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/static/logo-ie.png" alt="" width="36" height="36"><strong>Mentirômetro</strong></a>
    <nav class="nav" aria-label="Seções">
      <a class="here" href="/">Ao vivo</a>
      <a href="/leitura">Leitura</a>
      <a href="/checar">Checar</a>
      <a href="/dashboard">Placar</a>
      <a href="/metodo">Método</a>
    </nav>
  </header>
  <main>
    <form id="login" class="login">
      <input id="password" type="password" placeholder="Senha do painel" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="app" hidden>
      <aside id="saved" class="saved"></aside>
      <p class="lead">Ouça um link e leia o que foi dito. Para checar uma frase e copiar a resposta, use Checar frase. O placar fica separado.</p>
      <form id="controls" class="bar">
        <select id="fonte">
          <option value="bandnews_sp">BandNews FM SP</option>
          <option value="custom">Outro link de rádio</option>
        </select>
        <select id="gravar">
          <option value="1">Gravar no debate ativo</option>
          <option value="0">Só ouvir agora, sem gravar</option>
        </select>
        <input id="url" type="url" required>
        <button type="submit">Ouvir a live</button>
        <button id="stop" class="ghost" type="button">Parar</button>
        <span id="status" class="meta"></span>
      </form>
      <div class="tools">
        <button id="new-debate" class="ghost" type="button">Criar o próximo debate</button>
        <button id="reset" class="ghost" type="button">Limpar só a fila</button>
      </div>
      <p id="error" class="error"></p>
      <div class="grid">
        <section>
          <h2>Transcrição</h2>
          <div class="actions">
            <button id="check-selected" type="button">Checar trechos marcados</button>
            <button id="download-transcript" class="ghost" type="button">Baixar transcrição completa</button>
            <span id="selected-count" class="meta">Nenhum trecho marcado</span>
            <span id="segments-total" class="meta"></span>
          </div>
          <div id="segments"></div>
        </section>
        <section>
          <h2>Checagens</h2>
          <form id="manual" class="composer">
            <select id="speaker">
              <option value="avulsa">Só checar, sem entrar no placar</option>
              <option value="lula">Atribuir a Lula, sem entrar no placar</option>
              <option value="flavio">Atribuir a Flávio, sem entrar no placar</option>
            </select>
            <textarea id="phrase" placeholder="Cole a frase. Ela não substitui o debate salvo." required></textarea>
            <button type="submit">Checar esta frase</button>
          </form>
          <div id="claims"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="/static/card.js"></script>
  <script>
    const labels = {
      pendente: "Checando",
      processando: "Checando",
      sustentado: "Sustentado",
      sustentado_ressalva: "Sustentado com ressalva",
      nao_e_bem_assim: "Não é bem assim",
      contradito: "Contradito",
      exagerado: "Exagerado",
      distorcido: "Distorcido",
      sem_prova: "Sem prova",
      sem_prova_publica: "Sem prova pública",
      versoes_em_disputa: "Versões em disputa",
      indicio: "Indício",
      dados_incompletos: "Dados incompletos",
      audio_confuso: "Áudio confuso",
      promessa: "Promessa",
      sem_evidencia: "Sem fonte suficiente",
      inconclusivo: "Em aberto",
      erro: "Erro na consulta"
    };
    const login = document.querySelector("#login");
    const app = document.querySelector("#app");
    const errorBox = document.querySelector("#error");
    const marked = new Set();
    let latestSegments = [];
    let claimById = new Map();

    async function api(path, options) {
      const response = await fetch(path, { credentials: "same-origin", ...options });
      if (response.status === 401) {
        app.hidden = true;
        login.hidden = false;
        throw new Error("faça login");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "falha na consulta");
      return data;
    }

    async function sendCheck(text) {
      const speaker = document.querySelector("#speaker").value || "avulsa";
      await api("/api/checar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, speaker })
      });
      await refresh();
    }

    login.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      try {
        await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.querySelector("#password").value })
        });
        login.hidden = true;
        app.hidden = false;
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    const fonte = document.querySelector("#fonte");
    const urlInput = document.querySelector("#url");
    const bandnews = "https://playerservices.streamtheworld.com/api/livestream-redirect/BANDNEWSFM_SPAAC.m3u8?dist=bandsite";
    fonte.addEventListener("change", () => {
      if (fonte.value === "bandnews_sp") urlInput.value = bandnews;
    });
    document.querySelector("#controls").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const stream = fonte.value === "bandnews_sp" ? bandnews : urlInput.value;
        await api("/api/iniciar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ youtube_url: stream, gravar: document.querySelector("#gravar").value === "1" })
        });
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#stop").addEventListener("click", async () => {
      await api("/api/parar", { method: "POST" });
      await refresh();
    });

    document.querySelector("#reset").addEventListener("click", async () => {
      if (!window.confirm("Limpar a fila (pendentes e erros)? Vereditos já resolvidos e a transcrição continuam gravados.")) return;
      marked.clear();
      await api("/api/zerar", { method: "POST" });
      await refresh();
    });

    document.querySelector("#download-transcript").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/transcricao?download=1", { credentials: "include" });
        if (!response.ok) throw new Error("Não foi possível baixar a transcrição.");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "transcricao-debate.txt";
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#new-debate").addEventListener("click", async () => {
      const title = window.prompt("Nome do próximo debate. O debate Band — 18/10 continua salvo.");
      if (!title || title.trim().length < 3) return;
      try {
        await api("/api/debates", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title.trim() })
        });
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#manual").addEventListener("submit", async (event) => {
      event.preventDefault();
      const phrase = document.querySelector("#phrase");
      await sendCheck(phrase.value);
      phrase.value = "";
    });

    document.querySelector("#check-selected").addEventListener("click", async () => {
      const text = latestSegments
        .filter((row) => marked.has(row.id))
        .sort((a, b) => a.id - b.id)
        .map((row) => row.text)
        .join(" ");
      if (text.trim().length < 12) {
        errorBox.textContent = "Marque trechos suficientes para formar a frase.";
        return;
      }
      await sendCheck(text);
      marked.clear();
    });

    document.querySelector("#claims").addEventListener("click", async (event) => {
      const imageButton = event.target.closest("[data-card]");
      if (imageButton) {
        const claim = claimById.get(Number(imageButton.dataset.id));
        if (claim) MentiroCard.png(claim, imageButton.dataset.card);
        return;
      }
      const button = event.target.closest("[data-copy]");
      const correct = event.target.closest("[data-correct]");
      const hide = event.target.closest("[data-hide]");
      if (correct) {
        const text = window.prompt("Texto da correção que entra no card público.");
        if (!text || text.trim().length < 8) return;
        try {
          await api("/api/claims/" + correct.dataset.correct + "/correcao", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text.trim() })
          });
          await refresh();
        } catch (error) {
          errorBox.textContent = error.message;
        }
        return;
      }
      if (hide) {
        try {
          await api("/api/claims/" + hide.dataset.hide + "/ocultar", { method: "POST" });
          await refresh();
        } catch (error) {
          errorBox.textContent = error.message;
        }
        return;
      }
      if (!button) return;
      const claim = claimById.get(Number(button.dataset.copy));
      if (!claim) return;
      const sources = (claim.sources || []).map((source) => source.url).filter(Boolean).join("\n");
      const text = [
        labels[claim.status] || claim.status,
        claim.normalized || claim.quote,
        claim.summary || "",
        sources
      ].filter(Boolean).join("\n\n");
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "Copiado";
      } catch (error) {
        errorBox.textContent = "Não foi possível copiar.";
      }
    });

    document.querySelector("#segments").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-check]");
      const box = event.target.closest("[data-mark]");
      if (button) {
        const row = latestSegments.find((item) => item.id === Number(button.dataset.check));
        if (row) await sendCheck(row.text);
      }
      if (box) {
        const id = Number(box.dataset.mark);
        if (box.checked) marked.add(id);
        else marked.delete(id);
        box.closest(".chunk").classList.toggle("marked", box.checked);
        updateCount();
      }
    });

    function updateCount() {
      const count = marked.size;
      document.querySelector("#selected-count").textContent = count
        ? count + (count === 1 ? " trecho marcado" : " trechos marcados, na ordem em que foram falados")
        : "Nenhum trecho marcado";
    }

    function render(state) {
      if (state.youtube_url) urlInput.value = state.youtube_url;
      else if (!urlInput.value) urlInput.value = bandnews;
      fonte.value = (urlInput.value || "").includes("BANDNEWSFM") ? "bandnews_sp" : "custom";
      const archive = state.archive;
      const saved = document.querySelector("#saved");
      if (archive) {
        saved.hidden = false;
        saved.innerHTML = `<strong>${escapeHtml(archive.title)} está salvo</strong><span class="meta">${archive.segments} trechos e ${archive.claims} checagens continuam no banco. Criar outro debate não apaga este.</span>`;
      } else {
        saved.hidden = true;
      }
      const listening = state.running ? "Ouvindo agora" : "Escuta parada";
      const where = state.active_debate ? ` Novos trechos entram em ${state.active_debate.title}.` : "";
      const q = state.queue || {};
      const fila = (q.manuais || q.ao_vivo)
        ? ` Fila: ${q.manuais || 0} pedidas agora, ${q.ao_vivo || 0} da live.`
        : "";
      const ie = state.ie_mcp || {};
      const ieText = !ie.enabled
        ? " Inteligência Eleitoral desligada."
        : ie.ok
          ? " Inteligência Eleitoral ligada."
          : " Inteligência Eleitoral sem resposta agora.";
      document.querySelector("#status").textContent = listening + "." + where + fila + ieText;
      errorBox.textContent = state.last_error || "";
      const totalSegs = state.segments_total || 0;
      document.querySelector("#segments-total").textContent = state.persist === false
        ? "Esta escuta fica só nesta tela. Parar ou reiniciar apaga esses trechos."
        : (totalSegs ? `${totalSegs} trechos no banco, agrupados em falas` : "Nenhum trecho gravado ainda");
      const gravar = document.querySelector("#gravar");
      if (document.activeElement !== gravar) gravar.value = state.persist === false ? "0" : "1";
      const download = document.querySelector("#download-transcript");
      download.hidden = state.persist === false;
      latestSegments = state.persist === false ? (state.ephemeral || []) : (state.segments || []);
      const alive = new Set(latestSegments.map((row) => row.id));
      for (const id of [...marked]) if (!alive.has(id)) marked.delete(id);
      document.querySelector("#segments").innerHTML = latestSegments.length
        ? latestSegments.map((row) => `<article class="chunk ${marked.has(row.id) ? "marked" : ""}">
            <div class="row">
              <input type="checkbox" data-mark="${row.id}" ${marked.has(row.id) ? "checked" : ""} aria-label="Marcar trecho">
              <p>${escapeHtml(row.text)}</p>
            </div>
            <div class="actions">
              <button type="button" class="ghost" data-check="${row.id}">Checar este trecho</button>
              <span class="meta">${escapeHtml(formatWhen(row.created_at))}${row.parts > 1 ? ` · ${row.parts} trechos juntos` : ""}</span>
            </div>
          </article>`).join("")
        : `<p class="meta">${state.persist === false ? "Os trechos de agora aparecem aqui e não entram no debate salvo." : "A transcrição aparece aqui, com o trecho mais novo no topo."}</p>`;
      updateCount();
      claimById = new Map((state.claims || []).map((claim) => [claim.id, claim]));
      document.querySelector("#claims").innerHTML = state.claims.length
        ? state.claims.map(renderClaim).join("")
        : `<p class="meta">Nenhuma frase enviada ainda.</p>`;
      const reports = state.reports || [];
      if (reports.length) {
        document.querySelector("#claims").insertAdjacentHTML(
          "afterbegin",
          `<p class="meta">Avisos de erro: ${reports.map((row) => `#${row.claim_id} ${escapeHtml(row.note)}`).join(" · ")}</p>`
        );
      }
    }

    function formatWhen(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "";
      return date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function renderClaim(claim) {
      const label = labels[claim.status] || claim.status;
      const sources = (claim.sources || []).map((source) =>
        `<li><span class="meta">${escapeHtml(source.kind || "")}</span> <a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a> ${escapeHtml(source.excerpt || source.note || "")}</li>`
      ).join("");
      const correction = claim.correction ? `<p class="meta">Correção publicada: ${escapeHtml(claim.correction)}</p>` : "";
      const air = claim.listed === 0 ? "Republicar" : "Tirar do ar";
      return `<article class="claim">
        <span class="chip ${escapeHtml(claim.status)}">${escapeHtml(label)}</span>
        <p><strong>${escapeHtml(claim.normalized)}</strong></p>
        <div class="actions">
          <button type="button" class="ghost" data-copy="${claim.id}">Copiar resposta</button>
          <button type="button" class="ghost" data-card="feed" data-id="${claim.id}">Imagem</button>
          <button type="button" class="ghost" data-card="stories" data-id="${claim.id}">Stories</button>
          <button type="button" class="ghost" data-correct="${claim.id}">Publicar correção</button>
          <button type="button" class="ghost" data-hide="${claim.id}">${air}</button>
        </div>
        <p class="meta">${escapeHtml(claim.quote)}</p>
        <p>${escapeHtml(claim.summary || "")}</p>
        ${claim.missing ? `<p class="meta">${escapeHtml(claim.missing)}</p>` : ""}
        ${correction}
        ${sources ? `<ul>${sources}</ul>` : ""}
      </article>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    async function refresh() {
      if (app.hidden) return;
      try {
        render(await api("/api/estado"));
      } catch (error) {
        if (error.message !== "faça login") errorBox.textContent = error.message;
      }
    }

    setInterval(refresh, 3000);
    refresh();
  </script>
</body>
</html>
