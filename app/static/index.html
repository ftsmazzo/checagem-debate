<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0c">
  <title>Ao vivo · Mentirômetro</title>
  <link rel="icon" type="image/png" href="/static/logo-ie-icon.png">
  <link rel="stylesheet" href="/static/shell.css">
  <style>
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding-top: 18px; }
    .saved {
      margin: 16px 0 0;
      padding: 12px 14px;
      background: var(--plate);
      border: 1px solid var(--ie-line);
    }
    .saved strong { display: block; margin-bottom: 4px; }
    .lead { margin: 0 0 12px; color: var(--ie-ink-soft); max-width: 62ch; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
    h1 { display: none; }
    .bar, .composer, .login, section {
      background: var(--plate);
      border: 1px solid var(--ie-line);
      border-radius: 0;
      box-shadow: none;
    }
    .bar, .login {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px;
    }
    .composer {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 12px;
      margin-top: 0;
    }
    input, textarea, select, button {
      font: inherit;
      border-radius: var(--ie-radius-sm);
      border: 1px solid var(--ie-line);
    }
    input, textarea, select {
      background: var(--ie-bg-soft);
      color: var(--ie-ink);
      caret-color: var(--coral);
      padding: 10px 12px;
    }
    input, select { min-width: 0; }
    #fonte, #gravar { flex: 1 1 240px; min-width: 0; max-width: 340px; }
    #url { flex: 1 1 280px; min-width: 0; }
    textarea { min-height: 140px; width: 100%; resize: vertical; }
    button {
      background: var(--coral);
      color: var(--night);
      padding: 10px 14px;
      cursor: pointer;
      font-family: "Archivo Black", sans-serif;
      font-weight: 400;
      letter-spacing: 0.03em;
      border: 1px solid var(--coral);
    }
    button:hover { background: var(--ie-coral-deep); border-color: var(--ie-coral-deep); color: var(--night); }
    button.ghost {
      background: transparent;
      color: var(--ie-ink-soft);
      border-color: var(--ie-line);
    }
    button.ghost:hover {
      background: var(--ie-accent-soft);
      color: var(--ie-ink);
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--ie-accent);
      outline-offset: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
      gap: 16px;
      margin: 16px 0 48px;
    }
    section { padding: 16px 18px; min-height: 280px; }
    h2 {
      margin: 0 0 12px;
      font-family: "Archivo Black", sans-serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .chunk p { margin: 0; line-height: 1.6; max-width: 68ch; }
    .chunk:first-of-type, .claim:first-of-type { border-top: 0; }
    .chunk { padding: 14px 0; border-top: 1px solid var(--ie-line); }
    .chunk.live .meta {
      color: var(--mark);
      font-family: "Archivo Black", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .chunk.marked {
      background: var(--ie-coral-soft);
      margin: 0 -8px;
      padding-left: 8px;
      padding-right: 8px;
    }
    .row { display: flex; gap: 10px; align-items: flex-start; }
    .row p { margin: 0; line-height: 1.45; color: var(--ie-ink-soft); }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .meta { color: var(--ie-muted); font-size: 0.82rem; font-weight: 500; }
    .error { color: var(--ie-danger); white-space: pre-wrap; margin: 10px 0; }
    #login { margin: 16px 0; }
    .claim strong { font-weight: 800; color: var(--ie-ink); }
    .claim ul { margin: 8px 0 0; padding-left: 18px; color: var(--ie-ink-soft); }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
      .bar, .tools, .actions, section, .composer { max-width: 100%; min-width: 0; }
      #fonte, #gravar, #url, .bar button, .tools button, .actions button { flex: 1 1 100%; max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="/static/logo-ie-mark.png" alt="Inteligência Eleitoral"><strong>Mentirômetro</strong></a>
    <nav class="nav" aria-label="Seções">
      <a class="here" href="/">Ao vivo</a>
      <a href="/leitura">Leitura</a>
      <a href="/checar">Checar</a>
      <a href="/dashboard">Placar</a>
      <a href="/metodo">Método</a>
    </nav>
  </header>
  <main>
    <form id="login" class="login" hidden>
      <input id="password" type="password" placeholder="Senha do painel" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="app">
      <aside id="saved" class="saved" hidden></aside>
      <p class="lead">No GloboPlay, deixe o debate tocando na outra aba e use Ouvir a aba. O Chrome pede essa aba e o áudio dela. A senha da Globo não entra aqui. Rádio e YouTube continuam no link.</p>
      <form id="controls" class="bar">
        <select id="fonte">
          <option value="bandnews_sp">BandNews FM SP</option>
          <option value="cbn_sp">CBN São Paulo</option>
          <option value="custom">Outro link de rádio</option>
        </select>
        <select id="gravar">
          <option value="1">Gravar no debate ativo</option>
          <option value="0">Só ouvir agora, sem gravar</option>
        </select>
        <input id="url" type="url" required>
        <button type="submit">Ouvir a live</button>
        <button id="stop" class="ghost" type="button">Parar</button>
        <span id="status" class="meta"></span>
      </form>
      <div class="tools">
        <button id="aba" type="button" title="Escolha a aba do GloboPlay e marque compartilhar o áudio">Ouvir a aba do GloboPlay</button>
        <button id="new-debate" class="ghost" type="button">Criar o próximo debate</button>
        <button id="reset" class="ghost" type="button">Limpar só a fila</button>
      </div>
      <p id="error" class="error"></p>
      <div class="grid">
        <section>
          <h2>Transcrição</h2>
          <div class="actions">
            <button id="check-selected" type="button">Checar trechos marcados</button>
            <button id="download-transcript" class="ghost" type="button">Baixar transcrição completa</button>
            <span id="selected-count" class="meta">Nenhum trecho marcado</span>
            <span id="segments-total" class="meta"></span>
          </div>
          <div id="segments"></div>
        </section>
        <section>
          <h2>Checagens</h2>
          <form id="manual" class="composer">
            <select id="speaker">
              <option value="avulsa">Só checar, sem entrar no placar</option>
              <option value="lula">Atribuir a Lula, sem entrar no placar</option>
              <option value="flavio">Atribuir a Flávio, sem entrar no placar</option>
            </select>
            <textarea id="phrase" placeholder="Cole a frase. Ela não substitui o debate salvo." required></textarea>
            <button type="submit">Checar esta frase</button>
          </form>
          <div id="claims"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="/static/card.js"></script>
  <script>
    const labels = {
      pendente: "Checando",
      processando: "Checando",
      sustentado: "Verdadeiro",
      sustentado_ressalva: "Verdadeiro, mas...",
      nao_e_bem_assim: "Não é bem assim",
      contradito: "Falso",
      exagerado: "Exagerado",
      distorcido: "Distorcido",
      sem_prova: "Sem provas",
      sem_prova_publica: "Sem prova pública",
      versoes_em_disputa: "Versões em disputa",
      indicio: "Indício",
      dados_incompletos: "Dados incompletos",
      audio_confuso: "Áudio confuso",
      promessa: "Promessa",
      sem_evidencia: "Sem fonte suficiente",
      inconclusivo: "Em aberto",
      erro: "Erro na consulta"
    };
    const login = document.querySelector("#login");
    const app = document.querySelector("#app");
    const errorBox = document.querySelector("#error");
    const marked = new Set();
    let latestSegments = [];
    let claimById = new Map();

    async function api(path, options) {
      const response = await fetch(path, { credentials: "same-origin", ...options });
      if (response.status === 401) {
        app.hidden = true;
        login.hidden = false;
        throw new Error("faça login");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "falha na consulta");
      return data;
    }

    async function sendCheck(text) {
      const speaker = document.querySelector("#speaker").value || "avulsa";
      await api("/api/checar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, speaker })
      });
      await refresh();
    }

    login.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      try {
        await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.querySelector("#password").value })
        });
        login.hidden = true;
        app.hidden = false;
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    const fonte = document.querySelector("#fonte");
    const urlInput = document.querySelector("#url");
    const presets = {
      bandnews_sp: "https://playerservices.streamtheworld.com/api/livestream-redirect/BANDNEWSFM_SPAAC.m3u8?dist=bandsite",
      cbn_sp: "https://playerservices.streamtheworld.com/api/livestream-redirect/CBN_SPAAC.m3u8"
    };
    let appliedUrl = "";
    function applyServerUrl(url) {
      if (!url || url === appliedUrl) return;
      appliedUrl = url;
      urlInput.value = url;
      fonte.value = url.includes("BANDNEWSFM") ? "bandnews_sp" : url.includes("CBN_SP") ? "cbn_sp" : "custom";
    }
    fonte.addEventListener("change", () => {
      if (presets[fonte.value]) urlInput.value = presets[fonte.value];
    });
    document.querySelector("#controls").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const stream = presets[fonte.value] || urlInput.value;
        await api("/api/iniciar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ youtube_url: stream, gravar: document.querySelector("#gravar").value === "1" })
        });
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#stop").addEventListener("click", async () => {
      if (window.__abaParar) window.__abaParar();
      await api("/api/parar", { method: "POST" });
      await refresh();
    });

    function wavBlob(samples, rate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const text = (offset, value) => {
        for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
      };
      text(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      text(8, "WAVE");
      text(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, rate, true);
      view.setUint32(28, rate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      text(36, "data");
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const sample = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      }
      return new Blob([buffer], { type: "audio/wav" });
    }

    function sendAudio(blob, stop) {
      return fetch("/api/aba", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": blob.type || "audio/wav" },
        body: blob
      }).then(async (response) => {
        if (response.status === 401) {
          stop();
          errorBox.dataset.note = "faça login";
          return;
        }
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          errorBox.dataset.note = data.detail || "O trecho da aba não entrou.";
          errorBox.textContent = errorBox.dataset.note;
        }
      });
    }

    async function listenContinuously(stream, shouldStop, stop) {
      const context = new AudioContext();
      await context.resume();
      const code = `
        class CaptureProcessor extends AudioWorkletProcessor {
          constructor() {
            super();
            this.step = sampleRate / 16000;
            this.bucket = 0;
            this.bucketN = 0;
            this.fresh = [];
            this.carry = [];
            this.freshNeed = 16000 * 4;
            this.overlap = Math.floor(16000 * 0.6);
            this.port.onmessage = () => this.emit(true);
          }
          pushSample(value) {
            this.bucket += value;
            this.bucketN += 1;
            if (this.bucketN < this.step) return;
            this.fresh.push(this.bucket / this.bucketN);
            this.bucket = 0;
            this.bucketN = 0;
            if (this.fresh.length >= this.freshNeed) this.emit(false);
          }
          emit(force) {
            if (!force && this.fresh.length < this.freshNeed) return;
            if (force && this.fresh.length < 1600) return;
            let energy = 0;
            const chunk = this.carry.concat(this.fresh);
            for (let i = 0; i < chunk.length; i++) energy += chunk[i] * chunk[i];
            const keep = Math.min(this.overlap, this.fresh.length);
            this.carry = this.fresh.slice(this.fresh.length - keep);
            this.fresh = [];
            if (chunk.length && energy / chunk.length < 0.00004) return;
            this.port.postMessage(new Float32Array(chunk));
          }
          process(inputs) {
            const channels = inputs[0];
            if (!channels || !channels.length || !channels[0]) return true;
            const frames = channels[0].length;
            const scale = 1 / channels.length;
            for (let i = 0; i < frames; i++) {
              let mixed = 0;
              for (let channel = 0; channel < channels.length; channel++) mixed += channels[channel][i];
              this.pushSample(mixed * scale);
            }
            return true;
          }
        }
        registerProcessor("capture", CaptureProcessor);
      `;
      const moduleUrl = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
      await context.audioWorklet.addModule(moduleUrl);
      URL.revokeObjectURL(moduleUrl);
      const source = context.createMediaStreamSource(stream);
      const node = new AudioWorkletNode(context, "capture");
      const silent = context.createGain();
      silent.gain.value = 0;
      source.connect(node);
      node.connect(silent);
      silent.connect(context.destination);
      let chain = Promise.resolve();
      node.port.onmessage = (event) => {
        const blob = wavBlob(event.data, 16000);
        chain = chain.then(() => sendAudio(blob, stop)).catch((error) => {
          errorBox.dataset.note = error.message || "O trecho da aba não entrou.";
          errorBox.textContent = errorBox.dataset.note;
        });
      };
      while (!shouldStop()) {
        await new Promise((resolve) => setTimeout(resolve, 300));
      }
      node.port.postMessage("flush");
      await new Promise((resolve) => setTimeout(resolve, 200));
      await chain;
      source.disconnect();
      node.disconnect();
      await context.close();
    }

    document.querySelector("#aba").addEventListener("click", async () => {
      delete errorBox.dataset.note;
      errorBox.textContent = "";
      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        errorBox.dataset.note = "Este navegador não compartilha o áudio da aba. Abra o painel no Chrome.";
        errorBox.textContent = errorBox.dataset.note;
        return;
      }
      let capture;
      try {
        await api("/api/aba/iniciar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ gravar: document.querySelector("#gravar").value === "1" })
        });
        capture = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } catch (error) {
        await api("/api/parar", { method: "POST" }).catch(() => {});
        errorBox.dataset.note = error.name === "NotAllowedError"
          ? "A aba não foi compartilhada."
          : (error.message || "Não foi possível ouvir a aba.");
        errorBox.textContent = errorBox.dataset.note;
        return;
      }
      if (!capture.getAudioTracks().length) {
        capture.getTracks().forEach((track) => track.stop());
        await api("/api/parar", { method: "POST" }).catch(() => {});
        errorBox.dataset.note = "Escolha a aba do GloboPlay e marque compartilhar o áudio.";
        errorBox.textContent = errorBox.dataset.note;
        return;
      }
      const stream = new MediaStream(capture.getAudioTracks());
      let stopped = false;
      window.__abaParar = () => { stopped = true; };
      capture.getVideoTracks().forEach((track) => {
        track.addEventListener("ended", () => { stopped = true; });
      });
      try {
        await listenContinuously(stream, () => stopped, () => { stopped = true; });
      } catch (error) {
        errorBox.dataset.note = error.message || "A escuta da aba parou.";
        errorBox.textContent = errorBox.dataset.note;
      } finally {
        capture.getTracks().forEach((track) => track.stop());
        stream.getTracks().forEach((track) => track.stop());
        window.__abaParar = null;
        await api("/api/parar", { method: "POST" }).catch(() => {});
        await refresh();
      }
    });

    document.querySelector("#reset").addEventListener("click", async () => {
      if (!window.confirm("Limpar a fila (pendentes e erros)? Vereditos já resolvidos e a transcrição continuam gravados.")) return;
      marked.clear();
      await api("/api/zerar", { method: "POST" });
      await refresh();
    });

    document.querySelector("#download-transcript").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/transcricao?download=1", { credentials: "include" });
        if (!response.ok) throw new Error("Não foi possível baixar a transcrição.");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "transcricao-debate.txt";
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#new-debate").addEventListener("click", async () => {
      const title = window.prompt("Nome do próximo debate. O debate Band — 18/10 continua salvo.");
      if (!title || title.trim().length < 3) return;
      try {
        await api("/api/debates", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title.trim() })
        });
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#manual").addEventListener("submit", async (event) => {
      event.preventDefault();
      const phrase = document.querySelector("#phrase");
      await sendCheck(phrase.value);
      phrase.value = "";
    });

    document.querySelector("#check-selected").addEventListener("click", async () => {
      const text = latestSegments
        .filter((row) => marked.has(row.id))
        .sort((a, b) => a.id - b.id)
        .map((row) => row.text)
        .join(" ");
      if (text.trim().length < 12) {
        errorBox.textContent = "Marque trechos suficientes para formar a frase.";
        return;
      }
      await sendCheck(text);
      marked.clear();
    });

    document.querySelector("#claims").addEventListener("click", async (event) => {
      const imageButton = event.target.closest("[data-card]");
      if (imageButton) {
        const claim = claimById.get(Number(imageButton.dataset.id));
        if (claim) MentiroCard.png(claim, imageButton.dataset.card);
        return;
      }
      const button = event.target.closest("[data-copy]");
      const correct = event.target.closest("[data-correct]");
      const hide = event.target.closest("[data-hide]");
      if (correct) {
        const text = window.prompt("Texto da correção que entra no card público.");
        if (!text || text.trim().length < 8) return;
        try {
          await api("/api/claims/" + correct.dataset.correct + "/correcao", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: text.trim() })
          });
          await refresh();
        } catch (error) {
          errorBox.textContent = error.message;
        }
        return;
      }
      if (hide) {
        try {
          await api("/api/claims/" + hide.dataset.hide + "/ocultar", { method: "POST" });
          await refresh();
        } catch (error) {
          errorBox.textContent = error.message;
        }
        return;
      }
      if (!button) return;
      const claim = claimById.get(Number(button.dataset.copy));
      if (!claim) return;
      const sources = (claim.sources || []).map((source) => source.url).filter(Boolean).join("\n");
      const text = [
        labels[claim.status] || claim.status,
        claim.normalized || claim.quote,
        claim.summary || "",
        sources
      ].filter(Boolean).join("\n\n");
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "Copiado";
      } catch (error) {
        errorBox.textContent = "Não foi possível copiar.";
      }
    });

    document.querySelector("#segments").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-check]");
      const box = event.target.closest("[data-mark]");
      if (button) {
        const row = latestSegments.find((item) => item.id === Number(button.dataset.check));
        if (row) await sendCheck(row.text);
      }
      if (box) {
        const id = Number(box.dataset.mark);
        if (box.checked) marked.add(id);
        else marked.delete(id);
        box.closest(".chunk").classList.toggle("marked", box.checked);
        updateCount();
      }
    });

    function updateCount() {
      const count = marked.size;
      document.querySelector("#selected-count").textContent = count
        ? count + (count === 1 ? " trecho marcado" : " trechos marcados, na ordem em que foram falados")
        : "Nenhum trecho marcado";
    }

    function render(state) {
      if (state.youtube_url) applyServerUrl(state.youtube_url);
      else if (!urlInput.value) urlInput.value = presets.bandnews_sp;
      const archive = state.archive;
      const saved = document.querySelector("#saved");
      const now = state.active_debate;
      if (now) {
        saved.hidden = false;
        const old = archive && archive.slug !== now.slug
          ? ` ${archive.title} continua salvo, com ${archive.segments} trechos, e não entra aqui.`
          : "";
        saved.innerHTML = `<strong>Debate ativo: ${escapeHtml(now.title)}</strong><span class="meta">A transcrição e as checagens desta tela são deste debate.${escapeHtml(old)}</span>`;
      } else if (archive) {
        saved.hidden = false;
        saved.innerHTML = `<strong>${escapeHtml(archive.title)} está salvo</strong><span class="meta">${archive.segments} trechos e ${archive.claims} checagens continuam no banco.</span>`;
      } else {
        saved.hidden = true;
      }
      const listening = state.browser
        ? "Ouvindo a aba do GloboPlay"
        : state.running
          ? "Ouvindo agora"
          : "Escuta parada";
      const where = state.active_debate ? ` Novos trechos entram em ${state.active_debate.title}.` : "";
      const q = state.queue || {};
      const fila = (q.manuais || q.ao_vivo)
        ? ` Fila: ${q.manuais || 0} pedidas agora, ${q.ao_vivo || 0} da live.`
        : "";
      const ie = state.ie_mcp || {};
      const ieText = !ie.enabled
        ? " Inteligência Eleitoral desligada."
        : ie.ok
          ? " Inteligência Eleitoral ligada."
          : " Inteligência Eleitoral sem resposta agora.";
      document.querySelector("#status").textContent = listening + "." + where + fila + ieText;
      if (state.last_error) {
        delete errorBox.dataset.note;
        errorBox.textContent = state.last_error;
      } else if (errorBox.dataset.note) {
        errorBox.textContent = errorBox.dataset.note;
      } else {
        errorBox.textContent = "";
      }
      const totalSegs = state.segments_total || 0;
      document.querySelector("#segments-total").textContent = state.persist === false
        ? "Esta escuta fica só nesta tela. Parar ou reiniciar apaga esses trechos."
        : (totalSegs ? `${totalSegs} trechos neste debate, agrupados em falas` : "Nenhum trecho neste debate ainda");
      const gravar = document.querySelector("#gravar");
      if (document.activeElement !== gravar) gravar.value = state.persist === false ? "0" : "1";
      const download = document.querySelector("#download-transcript");
      download.hidden = state.persist === false;
      latestSegments = state.persist === false ? (state.ephemeral || []) : (state.segments || []);
      const alive = new Set(latestSegments.map((row) => row.id));
      for (const id of [...marked]) if (!alive.has(id)) marked.delete(id);
      const hearing = (state.hearing || "").trim();
      const live = hearing
        ? `<article class="chunk live"><p>${escapeHtml(hearing)}</p><span class="meta">entrando agora</span></article>`
        : "";
      const body = latestSegments.length
        ? latestSegments.map((row) => `<article class="chunk ${marked.has(row.id) ? "marked" : ""}">
            <div class="row">
              <input type="checkbox" data-mark="${row.id}" ${marked.has(row.id) ? "checked" : ""} aria-label="Marcar trecho">
              <p>${escapeHtml(row.text)}</p>
            </div>
            <div class="actions">
              <button type="button" class="ghost" data-check="${row.id}">Checar este trecho</button>
              <span class="meta">${escapeHtml(formatWhen(row.created_at))}${row.parts > 1 ? ` · ${row.parts} trechos juntos` : ""}</span>
            </div>
          </article>`).join("")
        : (hearing ? "" : `<p class="meta">${state.persist === false ? "Os trechos de agora aparecem aqui e não entram no debate salvo." : "A transcrição aparece aqui, com o trecho mais novo no topo."}</p>`);
      document.querySelector("#segments").innerHTML = live + body;
      updateCount();
      claimById = new Map((state.claims || []).map((claim) => [claim.id, claim]));
      document.querySelector("#claims").innerHTML = state.claims.length
        ? state.claims.map(renderClaim).join("")
        : `<p class="meta">Nenhuma frase enviada ainda.</p>`;
      const reports = state.reports || [];
      if (reports.length) {
        document.querySelector("#claims").insertAdjacentHTML(
          "afterbegin",
          `<p class="meta">Avisos de erro: ${reports.map((row) => `#${row.claim_id} ${escapeHtml(row.note)}`).join(" · ")}</p>`
        );
      }
    }

    function formatWhen(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "";
      return date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function renderClaim(claim) {
      const label = labels[claim.status] || claim.status;
      const sources = (claim.sources || []).map((source) =>
        `<li><span class="meta">${escapeHtml(source.kind || "")}</span> <a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a> ${escapeHtml(source.excerpt || source.note || "")}</li>`
      ).join("");
      const correction = claim.correction ? `<p class="meta">Correção publicada: ${escapeHtml(claim.correction)}</p>` : "";
      const air = claim.listed === 0 ? "Republicar" : "Tirar do ar";
      return `<article class="claim">
        <span class="chip ${escapeHtml(claim.status)}">${escapeHtml(label)}</span>
        <p><strong>${escapeHtml(claim.normalized)}</strong></p>
        <div class="actions">
          <button type="button" class="ghost" data-copy="${claim.id}">Copiar resposta</button>
          <button type="button" class="ghost" data-card="feed" data-id="${claim.id}">Imagem</button>
          <button type="button" class="ghost" data-card="stories" data-id="${claim.id}">Stories</button>
          <button type="button" class="ghost" data-correct="${claim.id}">Publicar correção</button>
          <button type="button" class="ghost" data-hide="${claim.id}">${air}</button>
        </div>
        <p class="meta">${escapeHtml(claim.quote)}</p>
        <p>${escapeHtml(claim.summary || "")}</p>
        ${claim.missing ? `<p class="meta">${escapeHtml(claim.missing)}</p>` : ""}
        ${correction}
        ${sources ? `<ul>${sources}</ul>` : ""}
      </article>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    async function refresh() {
      if (app.hidden) return;
      try {
        render(await api("/api/estado"));
      } catch (error) {
        if (error.message !== "faça login") errorBox.textContent = error.message;
      }
    }

    setInterval(refresh, 1500);
    refresh();
  </script>
</body>
</html>
