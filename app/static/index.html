<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8786a">
  <title>Sistema de checagem debate · IEleitoral</title>
  <link rel="icon" type="image/png" href="/static/logo-ie.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ie-bg: #0f141c;
      --ie-bg-soft: #171e29;
      --ie-surface: #1a222f;
      --ie-surface-2: #222b3a;
      --ie-ink: #f2f4f8;
      --ie-ink-soft: #d5dde8;
      --ie-muted: #9aa6b8;
      --ie-line: #2c3648;
      --ie-coral: #e8786a;
      --ie-coral-deep: #f08a7d;
      --ie-coral-soft: rgba(232, 120, 106, 0.2);
      --ie-accent: #7b93ff;
      --ie-accent-soft: rgba(91, 124, 250, 0.18);
      --ie-success: #3dce8f;
      --ie-warn: #e0a43a;
      --ie-danger: #ff6b6b;
      --ie-radius: 16px;
      --ie-radius-sm: 10px;
      --ie-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      --ie-font: "Montserrat", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ie-ink);
      background:
        radial-gradient(900px 420px at 8% -8%, rgba(232, 120, 106, 0.18), transparent 55%),
        radial-gradient(800px 380px at 92% 0%, rgba(91, 124, 250, 0.16), transparent 50%),
        var(--ie-bg);
      font-family: var(--ie-font);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    header, main { width: min(1180px, calc(100% - 28px)); margin: 0 auto; }
    header {
      padding: 28px 0 12px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .brand img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      box-shadow: var(--ie-shadow);
      object-fit: cover;
      background: var(--ie-surface);
    }
    .brand-copy { min-width: 0; }
    .brand-kicker {
      margin: 0 0 4px;
      color: var(--ie-coral);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ie-ink);
    }
    .bar, .composer, .login, section {
      background: var(--ie-surface);
      border: 1px solid var(--ie-line);
      border-radius: var(--ie-radius);
      box-shadow: var(--ie-shadow);
    }
    .bar, .composer, .login {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 12px;
    }
    input, textarea, select, button {
      font: inherit;
      border-radius: var(--ie-radius-sm);
      border: 1px solid var(--ie-line);
    }
    input, textarea, select {
      background: var(--ie-bg-soft);
      color: var(--ie-ink);
      padding: 10px 12px;
    }
    input, select { min-width: 180px; }
    #url, textarea { flex: 1; }
    textarea { min-height: 74px; width: 100%; }
    button {
      background: var(--ie-coral);
      color: #fff;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      border-color: transparent;
    }
    button:hover { background: var(--ie-coral-deep); }
    button.ghost {
      background: transparent;
      color: var(--ie-ink-soft);
      border-color: var(--ie-line);
    }
    button.ghost:hover {
      background: var(--ie-accent-soft);
      color: var(--ie-ink);
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--ie-accent);
      outline-offset: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
      margin: 16px 0 48px;
    }
    section { padding: 16px 18px; min-height: 280px; }
    h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .chunk, .claim { border-top: 1px solid var(--ie-line); padding: 12px 0; }
    .chunk:first-of-type, .claim:first-of-type { border-top: 0; }
    .chunk.marked {
      background: var(--ie-accent-soft);
      margin: 0 -8px;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 12px;
    }
    .row { display: flex; gap: 10px; align-items: flex-start; }
    .row p { margin: 0; line-height: 1.45; color: var(--ie-ink-soft); }
    .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .meta { color: var(--ie-muted); font-size: 0.82rem; font-weight: 500; }
    .chip {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #0f141c;
      letter-spacing: 0.02em;
    }
    .sustentado { background: var(--ie-success); }
    .contradito { background: var(--ie-danger); color: #fff; }
    .exagerado { background: var(--ie-warn); }
    .sem_evidencia, .inconclusivo, .erro { background: var(--ie-accent); color: #fff; }
    .pendente { background: var(--ie-muted); color: #0f141c; }
    .error { color: #ffb4b4; white-space: pre-wrap; margin: 10px 0; }
    a { color: var(--ie-accent); }
    #login { margin: 16px 0; }
    .composer { margin-top: 12px; }
    .claim strong { font-weight: 800; color: var(--ie-ink); }
    .claim ul { margin: 8px 0 0; padding-left: 18px; color: var(--ie-ink-soft); }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/static/logo-ie.png" alt="IEleitoral" width="52" height="52">
      <div class="brand-copy">
        <p class="brand-kicker">IEleitoral</p>
        <h1>Sistema de checagem debate</h1>
      </div>
    </div>
  </header>
  <main>
    <form id="login" class="login">
      <input id="password" type="password" placeholder="Senha do painel" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <div id="app" hidden>
      <form id="controls" class="bar">
        <select id="fonte">
          <option value="bandnews_sp">BandNews FM SP</option>
          <option value="custom">Outro link</option>
        </select>
        <input id="url" type="url" required>
        <button type="submit">Ouvir a live</button>
        <button id="stop" class="ghost" type="button">Parar</button>
        <button id="reset" class="ghost" type="button">Limpar checagens</button>
        <span id="status" class="meta"></span>
      </form>
      <p id="error" class="error"></p>
      <div class="grid">
        <section>
          <h2>Transcrição</h2>
          <div class="actions">
            <button id="check-selected" type="button">Checar trechos marcados</button>
            <button id="download-transcript" class="ghost" type="button">Baixar transcrição completa</button>
            <span id="selected-count" class="meta">Nenhum trecho marcado</span>
            <span id="segments-total" class="meta"></span>
          </div>
          <div id="segments"></div>
        </section>
        <section>
          <h2>Checagens</h2>
          <form id="manual" class="composer">
            <textarea id="phrase" placeholder="Cole ou escreva a frase para checar." required></textarea>
            <button type="submit">Checar esta frase</button>
          </form>
          <div id="claims"></div>
        </section>
      </div>
    </div>
  </main>
  <script>
    const labels = {
      pendente: "Checando",
      processando: "Checando",
      sustentado: "Com fonte a favor",
      contradito: "Fontes contrariam",
      exagerado: "Recorte exagerado",
      sem_evidencia: "Sem fonte suficiente",
      inconclusivo: "Depende do recorte",
      erro: "Erro na consulta"
    };
    const login = document.querySelector("#login");
    const app = document.querySelector("#app");
    const errorBox = document.querySelector("#error");
    const marked = new Set();
    let latestSegments = [];

    async function api(path, options) {
      const response = await fetch(path, { credentials: "same-origin", ...options });
      if (response.status === 401) {
        app.hidden = true;
        login.hidden = false;
        throw new Error("faça login");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || "falha na consulta");
      return data;
    }

    async function sendCheck(text) {
      await api("/api/checar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      await refresh();
    }

    login.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      try {
        await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.querySelector("#password").value })
        });
        login.hidden = true;
        app.hidden = false;
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    const fonte = document.querySelector("#fonte");
    const urlInput = document.querySelector("#url");
    const bandnews = "https://playerservices.streamtheworld.com/api/livestream-redirect/BANDNEWSFM_SPAAC.m3u8?dist=bandsite";
    fonte.addEventListener("change", () => {
      if (fonte.value === "bandnews_sp") urlInput.value = bandnews;
    });
    document.querySelector("#controls").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const stream = fonte.value === "bandnews_sp" ? bandnews : urlInput.value;
        await api("/api/iniciar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ youtube_url: stream })
        });
        await refresh();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#stop").addEventListener("click", async () => {
      await api("/api/parar", { method: "POST" });
      await refresh();
    });

    document.querySelector("#reset").addEventListener("click", async () => {
      if (!window.confirm("Limpar só as checagens? A transcrição completa continua gravada no banco.")) return;
      marked.clear();
      await api("/api/zerar", { method: "POST" });
      await refresh();
    });

    document.querySelector("#download-transcript").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/transcricao?download=1", { credentials: "include" });
        if (!response.ok) throw new Error("Não foi possível baixar a transcrição.");
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "transcricao-debate.txt";
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    document.querySelector("#manual").addEventListener("submit", async (event) => {
      event.preventDefault();
      const phrase = document.querySelector("#phrase");
      await sendCheck(phrase.value);
      phrase.value = "";
    });

    document.querySelector("#check-selected").addEventListener("click", async () => {
      const text = latestSegments
        .filter((row) => marked.has(row.id))
        .sort((a, b) => a.id - b.id)
        .map((row) => row.text)
        .join(" ");
      if (text.trim().length < 12) {
        errorBox.textContent = "Marque trechos suficientes para formar a frase.";
        return;
      }
      await sendCheck(text);
      marked.clear();
    });

    document.querySelector("#segments").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-check]");
      const box = event.target.closest("[data-mark]");
      if (button) {
        const row = latestSegments.find((item) => item.id === Number(button.dataset.check));
        if (row) await sendCheck(row.text);
      }
      if (box) {
        const id = Number(box.dataset.mark);
        if (box.checked) marked.add(id);
        else marked.delete(id);
        box.closest(".chunk").classList.toggle("marked", box.checked);
        updateCount();
      }
    });

    function updateCount() {
      const count = marked.size;
      document.querySelector("#selected-count").textContent = count
        ? count + (count === 1 ? " trecho marcado" : " trechos marcados, na ordem em que foram falados")
        : "Nenhum trecho marcado";
    }

    function render(state) {
      if (state.youtube_url) urlInput.value = state.youtube_url;
      else if (!urlInput.value) urlInput.value = bandnews;
      fonte.value = (urlInput.value || "").includes("BANDNEWSFM") ? "bandnews_sp" : "custom";
      const ie = state.ie_mcp ? " · IE ligada" : "";
      const q = state.queue || {};
      const fila = q.done || q.pending || q.erro
        ? ` · ${q.done || 0} resolvidas · ${q.pending || 0} na fila`
        : "";
      document.querySelector("#status").textContent = (state.running ? "ouvindo a BandNews" : "parado") + ie + fila;
      errorBox.textContent = state.last_error || "";
      const totalSegs = state.segments_total || 0;
      document.querySelector("#segments-total").textContent = totalSegs
        ? `${totalSegs} trechos gravados (recuperáveis)`
        : "Nenhum trecho gravado ainda";
      latestSegments = state.segments || [];
      const alive = new Set(latestSegments.map((row) => row.id));
      for (const id of [...marked]) if (!alive.has(id)) marked.delete(id);
      document.querySelector("#segments").innerHTML = latestSegments.length
        ? latestSegments.map((row) => `<article class="chunk ${marked.has(row.id) ? "marked" : ""}">
            <div class="row">
              <input type="checkbox" data-mark="${row.id}" ${marked.has(row.id) ? "checked" : ""} aria-label="Marcar trecho">
              <p>${escapeHtml(row.text)}</p>
            </div>
            <div class="actions">
              <button type="button" class="ghost" data-check="${row.id}">Checar este trecho</button>
              <span class="meta">${escapeHtml(formatWhen(row.created_at))}</span>
            </div>
          </article>`).join("")
        : `<p class="meta">A transcrição aparece aqui, com o trecho mais novo no topo.</p>`;
      updateCount();
      document.querySelector("#claims").innerHTML = state.claims.length
        ? state.claims.map(renderClaim).join("")
        : `<p class="meta">Nenhuma frase enviada ainda.</p>`;
    }

    function formatWhen(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "";
      return date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function renderClaim(claim) {
      const label = labels[claim.status] || claim.status;
      const sources = (claim.sources || []).map((source) =>
        `<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer">${escapeHtml(source.title)}</a> ${escapeHtml(source.note || "")}</li>`
      ).join("");
      return `<article class="claim">
        <span class="chip ${escapeHtml(claim.status)}">${escapeHtml(label)}</span>
        <p><strong>${escapeHtml(claim.normalized)}</strong></p>
        <p class="meta">${escapeHtml(claim.quote)}</p>
        <p>${escapeHtml(claim.summary || "")}</p>
        ${claim.missing ? `<p class="meta">${escapeHtml(claim.missing)}</p>` : ""}
        ${sources ? `<ul>${sources}</ul>` : ""}
      </article>`;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    async function refresh() {
      if (app.hidden) return;
      try {
        render(await api("/api/estado"));
      } catch (error) {
        if (error.message !== "faça login") errorBox.textContent = error.message;
      }
    }

    setInterval(refresh, 3000);
    refresh();
  </script>
</body>
</html>
